# Bolge Stratejisi: sunucu + Postgres 16 (Alfa-0 isletim). Yapilandirma yalniz ortam degiskenleriyle.
#   cp deploy/.env.ornek deploy/.env && $EDITOR deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Statik dogrulama (daemon gerekmez):  docker compose -f deploy/docker-compose.yml --env-file deploy/.env.ornek config
name: bolge

services:
  pg:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: bolge
      POSTGRES_DB: bolge
      POSTGRES_PASSWORD: ${PG_SIFRE:?PG_SIFRE gerekli (deploy/.env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolge -d bolge"]
      interval: 10s
      timeout: 3s
      retries: 10
    # Veritabani disariya yayinlanmaz: yalniz compose agi (sunucu) erisir.

  sunucu:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    # Kapanista kuyruk yazilir ve kapanis goruntusu alinir: yeterli sure ver.
    stop_grace_period: 60s
    environment:
      BOLGE_URETIM: "1"
      BOLGE_DEPO: pg
      BOLGE_PG_URL: postgres://bolge:${PG_SIFRE:?PG_SIFRE gerekli}@pg:5432/bolge
      BOLGE_DUNYA: ${BOLGE_DUNYA:-ana}
      # Kimlik: yalniz e-posta baglantisiyla giris (G5). Uretimde gelistirme kimligi kapali; BOLGE_GELISTIRME_SIRRI VERILMEZ (yok sayilir).
      BOLGE_KIMLIK: eposta
      # Bilet ve baglanti imza sirri: >= 32 karakter, 'degistir...'/'gelistirme...' ile baslamaz. Rotasyonda eski sir BILET_SIRRI_ESKI'de kalir.
      BOLGE_BILET_SIRRI: ${BILET_SIRRI:?BILET_SIRRI gerekli (>= 32 karakter)}
      BOLGE_BILET_SIRRI_ESKI: ${BILET_SIRRI_ESKI:-}
      # Origin izin listesi (virgullu) ve postadaki baglantinin genel adresi (https): ikisi de zorunlu.
      BOLGE_IZINLI_KOKENLER: ${IZINLI_KOKENLER:?IZINLI_KOKENLER gerekli (virgullu Origin listesi, ornek https://oyun.ornek.org)}
      BOLGE_GENEL_URL: ${GENEL_URL:?GENEL_URL gerekli (https://...)}
      BOLGE_GUVENILIR_PROXY: ${GUVENILIR_PROXY:-0}
      # Posta: gercek SMTP/SES bagdastirici henuz yok; 'dosya' postacisi baglantiyi /veri/posta altina JSON olarak yazar (kisisel veri + giris
      # baglantisi icerir: erisimi kisitli tutun, isi bitince silin). 'konsol' uretimde yasak.
      BOLGE_POSTA: dosya
      BOLGE_POSTA_DIZIN: /veri/posta
      # Insan testi: oyun baglantisi oturum olay kaydi (yalniz zaman ve opak oyuncu kimligi; KVKK KIMLIK.md §8). 1 = acik. Test oturumlari
      # ayri dunyada (BOLGE_DUNYA=test_<ad>) yapilir ve bitince `--test-dunya-sil` ile silinir (README kontrol listesi adim 13).
      BOLGE_OTURUM_KAYDI: ${OTURUM_KAYDI:-0}
      # Davetli listesi (kayit kapisi; bos = kapali). Dosya IMAJA GIRMEZ: ana makinedeki DAVET_DIZIN dizini /davet olarak salt okunur baglanir;
      # DAVETLI_LISTE_DOSYA bu dizindeki dosya adidir. Liste calisirken yeniden yuklenmez: degisince `docker compose restart sunucu`.
      BOLGE_DAVETLI_LISTE: ${DAVETLI_LISTE_DOSYA:+/davet/${DAVETLI_LISTE_DOSYA}}
      BOLGE_HOST: 0.0.0.0
      BOLGE_PORT: "8787"
      BOLGE_HARITA: ${BOLGE_HARITA:-sentetik}
      BOLGE_PARSEL: ${BOLGE_PARSEL:-0}
      BOLGE_TOHUM: ${BOLGE_TOHUM:-1}
      BOLGE_GOC: ${BOLGE_GOC:-0}
      # Periyodik anlik goruntu ayri is parcacaginda (worker_threads): ana dongu yalniz yapisal kopyayi alir. 0 = ana dongude.
      BOLGE_GORUNTU_ISCI: ${BOLGE_GORUNTU_ISCI:-1}
      # Esnaf Defteri odul dedektoru (kavram -> sistem_odul gunluge girer; cekirdek durumunu degistirir). 0 = kapali.
      BOLGE_ODUL: ${BOLGE_ODUL:-1}
      # Bos ortam degiskeni "verilmedi" sayilir (varsayilan epoch kullanilir).
      BOLGE_DUNYA_EPOCH: ${BOLGE_DUNYA_EPOCH:-}
      # Metrik: ayri port; konteyner icinde 0.0.0.0, bu yuzden token ZORUNLU (sunucu aksi halde baslamaz).
      BOLGE_METRIK_PORT: "9464"
      BOLGE_METRIK_HOST: 0.0.0.0
      BOLGE_METRIK_TOKEN: ${METRIK_TOKEN:?METRIK_TOKEN gerekli (>= 16 karakter)}
    volumes:
      # Dosya postacisi ve (BOLGE_DEPO=dosya olsaydi) dosya deposu: /veri (imajda node kullanicisina aittir).
      - veri:/veri
      # Davetli listesi dizini (salt okunur). Dizin yoksa docker bos bir dizin olusturur; liste dosyasi 'node' (uid 1000) tarafindan okunabilmeli (chmod 644).
      - ${DAVET_DIZIN:-./davet}:/davet:ro
    ports:
      # Yalniz localhost'a yayinlanir; disariya TLS sonlandiran bir ters vekil acsin.
      - "127.0.0.1:${SUNUCU_PORT:-8787}:8787"
      - "127.0.0.1:${METRIK_YAYIN_PORT:-9464}:9464"
    # Dosya deposu istenirse (BOLGE_DEPO=dosya): /veri hacmi imajda tanimlidir; compose'ta pg varsayilandir.

  # Duzenli yedek (Alfa-0): her gun YEDEK_SAAT'te (UTC) deploy/yedek-dondur.sh: pg_dump + sha256, dogrulama, en yeni YEDEK_SAKLA yedek kalir.
  # Betikler imaja GIRMEZ (salt okunur baglama); yedekler ana makinedeki YEDEK_DIZIN dizinine yazilir (varsayilan deploy/yedekler, git disi).
  # Yedek yalniz pg'yi kapsar: BILET_SIRRI/.env ve davet listesi AYRICA saklanir. Yedegi baska diske/makineye kopyalayin (ayni disk yedek degildir).
  yedek:
    image: postgres:16-bookworm
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    entrypoint: ["bash", "/yedek/yedek-dongu.sh"]
    environment:
      YEDEK_PG_URL: postgres://bolge@pg:5432/bolge
      PGPASSWORD: ${PG_SIFRE:?PG_SIFRE gerekli}
      YEDEK_HEDEF: /yedekler
      YEDEK_SAKLA: ${YEDEK_SAKLA:-7}
      YEDEK_SAAT: ${YEDEK_SAAT:-00:30}
    volumes:
      - ./yedek.sh:/yedek/yedek.sh:ro
      - ./yedek-dondur.sh:/yedek/yedek-dondur.sh:ro
      - ./yedek-dongu.sh:/yedek/yedek-dongu.sh:ro
      - ${YEDEK_DIZIN:-./yedekler}:/yedekler
    healthcheck:
      # Son BASARILI yedek 26 saatten yeni olmali (gunde bir yedek + pay). Ilk yedek konteyner baslarken alinir.
      test: ["CMD-SHELL", "test -n \"$$(find /yedekler/.son-basari -mmin -1560 2>/dev/null)\""]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 10m

volumes:
  pgdata:
  veri:
