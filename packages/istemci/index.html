<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bölge Stratejisi Dünya</title>
<meta name="description" content="Gerçek Dünya üzerinde, dört botun oynadığı bölge stratejisi simülasyonunu 3B küre üzerinde izleyin ve dolaşın.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232b7fb8'/%3E%3Cpath d='M8 12c4-5 9-3 10 1s-4 4-3 8-7 1-7-9z' fill='%23e8e1cc'/%3E%3C/svg%3E">
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<div id="uygulama">
  <div id="sahne-kap">
    <canvas id="sahne" tabindex="0" aria-label="Dünya küresi: sürükleyerek gezin, tekerlekle yakınlaşın"></canvas>
    <div id="etiketler" aria-hidden="true"></div>
    <div id="ust">
      <div class="kart-cubuk marka">Bölge Stratejisi<small>Dünya</small></div>
      <div class="kart-cubuk kart-zaman">
        <span class="zaman" id="zaman" aria-live="off">Gün 1 · 09:00</span>
        <button type="button" class="ikon-dugme" id="duraklat" aria-pressed="false" title="Duraklat / sürdür (Boşluk)" aria-label="Duraklat">⏸</button>
        <div class="segment" id="hizlar" role="group" aria-label="Dünya hızı (sim saniyesi / gerçek saniye)"></div>
        <span id="geride" hidden>sim geride</span>
      </div>
      <div class="kart-cubuk kart-takvim" id="takvim" hidden>
        <div class="takvim-tarih"><b id="takvim-gun">—</b><small id="takvim-yil"></small></div>
        <div class="hasat" id="hasat" role="img" aria-label="Aylık hasat ritmi"></div>
        <div class="hasat-deger"><b id="hasat-yuzde">%100</b><small>hasat</small></div>
      </div>
      <div class="bosluk"></div>
      <div class="kart-cubuk kart-sag">
        <button type="button" class="ikon-dugme" id="dunya-dugme" title="Tüm dünyayı göster" aria-label="Tüm dünya">🌍</button>
        <button type="button" class="ikon-dugme" id="kuzey" title="Kuzeyi yukarı getir (N)" aria-label="Kuzey yukarı">N</button>
        <button type="button" class="ikon-dugme" id="tema" title="Tema: otomatik / açık / koyu" aria-label="Tema değiştir">◐</button>
      </div>
    </div>
    <div id="mal-cubugu" role="group" aria-label="Mal seçici"></div>
    <div id="neden-seridi" aria-live="polite"></div>
    <div id="yardim">Sürükle: gez · Tekerlek/çimdik: yakınlaş · Çift tık: bölgeye uç · WASD/oklar: gezin · Q/E: döndür · N: kuzey</div>
    <div id="yukleme"><div><div class="donen"></div><div>Dünya kuruluyor…</div></div></div>
    <div id="hata-kutusu" hidden></div>
  </div>
  <aside id="panel" aria-label="Bilgi paneli">
    <button type="button" id="panel-tutamac" aria-label="Paneli aç/kapat"></button>
    <nav id="sekmeler" role="tablist" aria-label="Panel sekmeleri"></nav>
    <section id="sekme-icerik" role="tabpanel" tabindex="0"></section>
    <div id="panel-atif"></div>
  </aside>
</div>
</body>
</html>
